name: CI

on:
  push:
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/server/package.json
      - run: npm install
      - run: npm run migrate
      - run: npm run seed
      - run: npm test

  web_unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package.json
      - run: npm install
      - run: npm run test
      - run: npm run build

  web_e2e:
    runs-on: ubuntu-latest
    needs: web_unit
    continue-on-error: true
    defaults:
      run:
        working-directory: apps/web/e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/e2e/package.json
      - run: npm install
      - run: npx playwright install --with-deps
      - run: npm run test
